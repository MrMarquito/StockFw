name: warehouse_scanner
description: Mobile barcode scanning interface for Warehouse ERP
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  mobile_scanner: ^5.1.0       # Hardware camera barcode/QR scanner
  dio: ^5.4.0                  # HTTP client for FastAPI REST endpoints
  sqflite: ^2.3.0              # Local SQLite store for offline transaction queuing
  path_provider: ^2.1.0
  flutter_secure_storage: ^9.0.0 # Secure storage for JWT bearer tokens
  uuid: ^4.3.0
  sqflite_common_ffi_web: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
